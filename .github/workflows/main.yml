name: Build Water Sort Jungle - Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Game ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: HTML Game ZIP not found"
            exit 1
          fi

          echo "Found game ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Game files:"
          find extracted -type f | head -100

      - name: Find HTML file
        run: |
          set -e

          HTML_FILE=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: index.html not found inside ZIP"
            exit 1
          fi

          echo "HTML found: $HTML_FILE"

          mkdir -p android-wrapper/app/src/main/assets
          cp "$HTML_FILE" android-wrapper/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android Project
        run: |
          set -e

          mkdir -p android-wrapper/app/src/main/java/com/watersort/jungle
          mkdir -p android-wrapper/app/src/main/res/drawable
          mkdir -p android-wrapper/app/src/main/res/mipmap-hdpi
          mkdir -p android-wrapper/app/src/main/res/values
          mkdir -p android-wrapper/app/src/main/res/values-v31

          cat > android-wrapper/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WaterSortJungle"
          include(":app")
          EOF

          cat > android-wrapper/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-wrapper/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-wrapper/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.watersort.jungle'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.watersort.jungle'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Create MainActivity
        run: |
          cat > android-wrapper/app/src/main/java/com/watersort/jungle/MainActivity.java <<'EOF'
          package com.watersort.jungle;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  // Keep status bar visible.
                  window.setStatusBarColor(Color.rgb(26, 90, 46));

                  // Keep navigation bar visible.
                  window.setNavigationBarColor(Color.BLACK);

                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(false);

                      WindowInsetsController controller =
                              window.getInsetsController();

                      if (controller != null) {
                          controller.setSystemBarsBehavior(
                                  WindowInsetsController.BEHAVIOR_DEFAULT
                          );
                          controller.show(WindowInsets.Type.statusBars());
                          controller.show(WindowInsets.Type.navigationBars());
                      }
                  }

                  webView = new WebView(this);

                  webView.setBackgroundColor(Color.WHITE);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  // Prevent zoom / automatic scaling.
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);
                  settings.setTextZoom(100);
                  settings.setDefaultTextEncodingName("UTF-8");

                  webView.setWebViewClient(new WebViewClient());

                  // Do not allow the game to move into the status bar
                  // or underneath the navigation bar.
                  webView.setOnApplyWindowInsetsListener((v, insets) -> {

                      int top = 0;
                      int bottom = 0;

                      if (android.os.Build.VERSION.SDK_INT >= 30) {
                          android.graphics.Insets system =
                                  insets.getInsets(
                                          WindowInsets.Type.statusBars()
                                                  | WindowInsets.Type.navigationBars()
                                  );

                          top = system.top;
                          bottom = system.bottom;
                      }

                      v.setPadding(0, top, 0, bottom);

                      return insets;
                  });

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create Manifest
        run: |
          cat > android-wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Water Sort Jungle"
                  android:theme="@style/AppTheme"
                  android:resizeableActivity="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create App Icon
        run: |
          ICON=""

          for FILE in \
            "./Water-Sort-Jungle-App-Icon.png" \
            "./app-icon.png" \
            "./icon-1024.png" \
            "./1000118070.png"
          do
            if [ -f "$FILE" ]; then
              ICON="$FILE"
              break
            fi
          done

          if [ -n "$ICON" ]; then
            echo "Using icon: $ICON"
            cp "$ICON" android-wrapper/app/src/main/res/drawable/app_icon.png

            sed -i \
              's#android:theme="@style/AppTheme"#android:theme="@style/AppTheme" android:icon="@drawable/app_icon"#' \
              android-wrapper/app/src/main/AndroidManifest.xml
          else
            echo "No custom icon found. Using default Android icon."
          fi

      - name: Create Styles
        run: |
          cat > android-wrapper/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                     parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">false</item>

                  <item name="android:statusBarColor">#1A5A2E</item>
                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:windowNoTitle">true</item>

              </style>

          </resources>
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore water-sort-jungle-release.jks \
            -alias water_sort_jungle \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass WaterSortJungleStore2026 \
            -keypass WaterSortJungleStore2026 \
            -dname "CN=Water Sort Jungle, OU=Game, O=Water Sort Jungle, L=India, ST=Uttar Pradesh, C=IN"

      - name: Build Signed Release APK
        working-directory: android-wrapper
        run: |
          gradle assembleRelease \
            --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/water-sort-jungle-release.jks" \
            -Pandroid.injected.signing.store.password="WaterSortJungleStore2026" \
            -Pandroid.injected.signing.key.alias="water_sort_jungle" \
            -Pandroid.injected.signing.key.password="WaterSortJungleStore2026"

      - name: Verify APK Signature
        run: |
          APK=$(find android-wrapper/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          echo "APK: $APK"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

          echo "SIGNED APK VERIFIED SUCCESSFULLY"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Signed-Release-APK
          path: android-wrapper/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
